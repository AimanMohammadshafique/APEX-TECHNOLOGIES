<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird GOD MODE</title>

<style>
body{
margin:0;
overflow:hidden;
background:#70c5ce;
font-family:Arial;
}

canvas{
display:block;
}

#score{
position:absolute;
top:20px;
width:100%;
text-align:center;
font-size:36px;
color:white;
font-weight:bold;
}

#highscore{
position:absolute;
top:60px;
width:100%;
text-align:center;
font-size:18px;
color:white;
}

#msg{
position:absolute;
bottom:40px;
width:100%;
text-align:center;
font-size:20px;
color:white;
}

#pause{
position:absolute;
right:20px;
top:20px;
font-size:20px;
padding:6px 12px;
border:none;
background:white;
border-radius:8px;
}
</style>

</head>

<body>

<div id="score">0</div>
<div id="highscore">High Score: 0</div>
<div id="msg">Tap Screen To Fly</div>

<button id="pause">⏸</button>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let paused=false;

let bird={
x:120,
y:200,
size:18,
gravity:0.35,
lift:-7,
velocity:0,
wing:0
};

let pipes=[];
let pipeWidth=70;
let gap=200;

let groundX=0;

let clouds=[
{x:200,y:120},
{x:400,y:80},
{x:650,y:150}
];

let score=0;
let highScore=localStorage.getItem("flappyHigh") || 0;

document.getElementById("highscore").innerText="High Score: "+highScore;

let gameOver=false;

function jump(){

if(paused) return;

if(gameOver){
restart();
return;
}

bird.velocity=bird.lift;

}

document.addEventListener("touchstart",jump);
document.addEventListener("mousedown",jump);

document.getElementById("pause").onclick=function(){

paused=!paused;

this.innerText=paused?"▶":"⏸";

};

function restart(){

bird.y=200;
bird.velocity=0;

pipes=[];

score=0;

gameOver=false;

document.getElementById("score").innerText=score;
document.getElementById("msg").innerText="Tap Screen To Fly";

}

function createPipe(){

let top=Math.random()*(canvas.height-gap-200)+80;

pipes.push({
x:canvas.width,
top:top,
bottom:top+gap,
passed:false
});

}

function update(){

if(paused || gameOver) return;

bird.velocity+=bird.gravity;
bird.y+=bird.velocity;

bird.wing+=0.3;

groundX-=2;
if(groundX<-canvas.width) groundX=0;

clouds.forEach(c=>{
c.x-=0.5;
if(c.x<-100) c.x=canvas.width+100;
});

if(bird.y+bird.size>canvas.height-80){
endGame();
}

if(bird.y<0) bird.y=0;

if(pipes.length===0 || pipes[pipes.length-1].x<canvas.width-300){
createPipe();
}

pipes.forEach(pipe=>{

pipe.x-=2;

if(
bird.x+bird.size>pipe.x &&
bird.x-bird.size<pipe.x+pipeWidth &&
(bird.y-bird.size<pipe.top || bird.y+bird.size>pipe.bottom)
){
endGame();
}

if(!pipe.passed && pipe.x+pipeWidth<bird.x){
score++;
pipe.passed=true;
document.getElementById("score").innerText=score;
}

});

}

function endGame(){

gameOver=true;

document.getElementById("msg").innerText="Game Over - Tap To Restart";

if(score>highScore){

highScore=score;

localStorage.setItem("flappyHigh",highScore);

document.getElementById("highscore").innerText="High Score: "+highScore;

}

}

function drawBackground(){

ctx.fillStyle="#70c5ce";
ctx.fillRect(0,0,canvas.width,canvas.height);

clouds.forEach(c=>{

ctx.fillStyle="white";

ctx.beginPath();
ctx.arc(c.x,c.y,25,0,Math.PI*2);
ctx.arc(c.x+25,c.y+10,20,0,Math.PI*2);
ctx.arc(c.x-25,c.y+10,20,0,Math.PI*2);
ctx.fill();

});

}

function drawBird(){

ctx.save();

ctx.translate(bird.x,bird.y);

ctx.rotate(bird.velocity*0.05);

ctx.fillStyle="yellow";

ctx.beginPath();
ctx.arc(0,0,bird.size,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="orange";

ctx.beginPath();
ctx.moveTo(10,0);
ctx.lineTo(20,5);
ctx.lineTo(10,10);
ctx.fill();

ctx.fillStyle="white";

ctx.beginPath();
ctx.arc(5,-5,4,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="black";

ctx.beginPath();
ctx.arc(6,-5,2,0,Math.PI*2);
ctx.fill();

ctx.restore();

}

function drawPipes(){

ctx.fillStyle="green";

pipes.forEach(pipe=>{

ctx.fillRect(pipe.x,0,pipeWidth,pipe.top);

ctx.fillRect(pipe.x,pipe.bottom,pipeWidth,canvas.height);

});

}

function drawGround(){

ctx.fillStyle="#ded895";

ctx.fillRect(groundX,canvas.height-80,canvas.width,80);
ctx.fillRect(groundX+canvas.width,canvas.height-80,canvas.width,80);

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

drawBackground();

drawPipes();

drawGround();

drawBird();

}

function loop(){

update();

draw();

requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
