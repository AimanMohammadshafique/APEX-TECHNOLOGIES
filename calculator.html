<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1f2937,#111827);
}

.calculator{
    width:340px;
    background:#1c1c1c;
    border-radius:25px;
    padding:20px;
    box-shadow:
        0 10px 25px rgba(0,0,0,0.5),
        inset 0 1px 2px rgba(255,255,255,0.1);
}

.display{
    width:100%;
    height:90px;
    border:none;
    outline:none;
    background:#0f172a;
    color:white;
    text-align:right;
    font-size:2.5rem;
    padding:15px;
    border-radius:15px;
    margin-bottom:20px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

button{
    height:65px;
    border:none;
    border-radius:18px;
    font-size:1.4rem;
    cursor:pointer;
    transition:0.15s;
    box-shadow:
        inset 0 1px 2px rgba(255,255,255,0.15),
        0 4px 10px rgba(0,0,0,0.4);
}

button:active{
    transform:scale(0.95);
}

.num{
    background:#333;
    color:white;
}

.operator{
    background:#ff9500;
    color:white;
}

.clear{
    background:#ef4444;
    color:white;
}

.equal{
    background:#22c55e;
    color:white;
}

.zero{
    grid-column:span 2;
}
</style>
</head>
<body>

<div class="calculator">
    <input type="text" class="display" id="display" readonly>

    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button class="operator" onclick="append('%')">%</button>
        <button class="operator" onclick="append('/')">÷</button>
        <button class="operator" onclick="append('*')">×</button>

        <button class="num" onclick="append('7')">7</button>
        <button class="num" onclick="append('8')">8</button>
        <button class="num" onclick="append('9')">9</button>
        <button class="operator" onclick="append('-')">−</button>

        <button class="num" onclick="append('4')">4</button>
        <button class="num" onclick="append('5')">5</button>
        <button class="num" onclick="append('6')">6</button>
        <button class="operator" onclick="append('+')">+</button>

        <button class="num" onclick="append('1')">1</button>
        <button class="num" onclick="append('2')">2</button>
        <button class="num" onclick="append('3')">3</button>
        <button class="equal" onclick="calculate()">=</button>

        <button class="num zero" onclick="append('0')">0</button>
        <button class="num" onclick="append('.')">.</button>
    </div>
</div>

<script>
const display = document.getElementById("display");

function append(value){
    display.value += value;
}

function clearDisplay(){
    display.value = "";
}

function calculate(){
    try{
        display.value = eval(display.value);
    }catch{
        display.value = "Error";
    }
}

document.addEventListener("keydown", (e)=>{
    if("0123456789+-*/.%".includes(e.key)){
        append(e.key);
    }
    else if(e.key === "Enter"){
        calculate();
    }
    else if(e.key === "Backspace"){
        display.value = display.value.slice(0,-1);
    }
    else if(e.key === "Escape"){
        clearDisplay();
    }
});
</script>

</body>
</html>
